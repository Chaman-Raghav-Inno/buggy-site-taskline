<div class="page-head">
  <h1 id="welcome">Dashboard</h1>
</div>
<section class="tiles" aria-label="Summary">
  <div class="tile"><p class="tile-label">Open tasks</p><p class="tile-value" id="t-open">–</p></div>
  <div class="tile"><p class="tile-label">Due today</p><p class="tile-value" id="t-today">–</p></div>
  <div class="tile tile-warn"><p class="tile-label">Overdue</p><p class="tile-value" id="t-overdue">–</p></div>
  <div class="tile"><p class="tile-label">Completed this week</p><p class="tile-value" id="t-week">–</p></div>
</section>
<div class="grid-2">
  <section class="card">
    <h2>My open tasks</h2>
    <ul id="my-tasks" class="list"></ul>
  </section>
  <section class="card">
    <h2>Projects</h2>
    <ul id="project-progress" class="list"></ul>
  </section>
</div>
<section class="card">
  <h2>Recent activity</h2>
  <ul id="activity" class="list"></ul>
</section>
