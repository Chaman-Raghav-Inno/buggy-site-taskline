<form id="forgot-form" class="card auth-card" novalidate>
  <h1>Reset your password</h1>
  <p class="muted">Enter your work email and we'll send you a link to choose a new password.</p>
  <div class="field">
    <label for="f-email">Work email</label>
    <input id="f-email" type="email" autocomplete="email">
  </div>
  <button type="submit" class="btn btn-block">Send reset link</button>
  <p id="forgot-msg" class="msg" role="status"></p>
  <p><a href="/login">Back to log in</a></p>
</form>
