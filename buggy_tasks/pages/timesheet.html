<div class="page-head">
  <h1>Timesheet</h1>
  <div class="actions">
    <button id="prev-week" type="button" class="btn btn-ghost btn-small">← Previous week</button>
    <button id="this-week" type="button" class="btn btn-ghost btn-small">This week</button>
    <button id="next-week" type="button" class="btn btn-ghost btn-small">Next week →</button>
  </div>
</div>
<p id="week-label" class="week-label"></p>
<div class="table-wrap">
  <table class="table timesheet" aria-label="Hours this week">
    <thead><tr id="ts-head"></tr></thead>
    <tbody id="ts-rows"></tbody>
    <tfoot><tr id="ts-foot"></tr></tfoot>
  </table>
</div>
<div class="grid-2">
  <section class="card">
    <h2>Weekly target</h2>
    <p id="target-text"></p>
    <div class="bar" role="presentation"><span id="target-bar"></span></div>
  </section>
  <form id="log-form" class="card form" novalidate data-needs="edit">
    <h2>Log time</h2>
    <div class="field">
      <label for="log-task">Task</label>
      <select id="log-task"></select>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="log-date">Date</label>
        <input id="log-date" type="date">
      </div>
      <div class="field">
        <label for="log-hours">Hours</label>
        <input id="log-hours" type="number" step="0.25" min="0.25" max="24" inputmode="decimal">
      </div>
    </div>
    <div class="field">
      <label for="log-note">Note (optional)</label>
      <input id="log-note" maxlength="200">
    </div>
    <p class="hint">Between 0.25 and 24 hours per entry, and at most 24 hours a day in total.</p>
    <button type="submit" class="btn">Log time</button>
    <p id="log-msg" class="msg" role="status"></p>
  </form>
</div>
<section class="card">
  <h2>Entries this week</h2>
  <ul id="entries" class="list"></ul>
</section>
